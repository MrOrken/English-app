<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Central Lightning & Star Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Lightning bolt -->
    <path d="M-20 -150 L60 -30 L0 -30 L40 150 L-60 20 L0 20 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Sensory sparkle stars around -->
    <circle cx="-110" cy="-70" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="120" cy="-60" r="10" fill="#ffffff" opacity="0.8"/>
    <circle cx="-90" cy="90" r="12" fill="#ffffff" opacity="0.85"/>
    <circle cx="110" cy="80" r="16" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
